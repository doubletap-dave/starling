models:
  # WhisperBackend (faster-whisper / CTranslate2)
  whisper-tiny:
    backend: whisper
    repo: Systran/faster-whisper-tiny
    vram_mb: 1024
    languages: auto
    supports_translate: true
    supports_timestamps: true

  whisper-base:
    backend: whisper
    repo: Systran/faster-whisper-base
    vram_mb: 1024
    languages: auto
    supports_translate: true
    supports_timestamps: true

  whisper-small:
    backend: whisper
    repo: Systran/faster-whisper-small
    vram_mb: 2048
