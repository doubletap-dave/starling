name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  FORGEJO_IMAGE: git:3000/ghostweasel/starling
  DOCKERHUB_IMAGE: topiary/starling

jobs:
  publish-forgejo:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v3

      - name: Resolve image version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          fi
          if [[ -z "${V}" ]]; then
            echo "Could not resolve version" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${V}"

      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: git:3000
          username: ${{ secrets.FR_USER }}
          password: ${{ secrets.FR_TOKEN }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          docker build \
            --label "org.opencontainers.image.version=${V}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${FORGEJO_IMAGE}:${V}" \
            -t "${FORGEJO_IMAGE}:latest" \
            .

      - name: Push to Forgejo
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          docker push "${FORGEJO_IMAGE}:${V}"
          docker push "${FORGEJO_IMAGE}:latest"

  # Only runs after Forgejo build+push succeed — no Docker Hub publish on partial failure.
  publish-dockerhub:
    needs: [publish-forgejo]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: git:3000
          username: ${{ secrets.FR_USER }}
          password: ${{ secrets.FR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from Forgejo, retag, push to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.publish-forgejo.outputs.version }}"
          docker pull "${FORGEJO_IMAGE}:${V}"
          docker pull "${FORGEJO_IMAGE}:latest"
          docker tag "${FORGEJO_IMAGE}:${V}" "${DOCKERHUB_IMAGE}:${V}"
          docker tag "${FORGEJO_IMAGE}:latest" "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:${V}"
          docker push "${DOCKERHUB_IMAGE}:latest"
