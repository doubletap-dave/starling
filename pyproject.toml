[project]
name = "starling"
version = "0.1.9"
description = "Universal OpenAI-compatible speech-to-text server"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "huggingface-hub>=0.26.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pyyaml>=6.0.2",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.1.0",
    "torch>=2.5.0",
    "transformers>=5.13.0",
    "accelerate>=1.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
nemo = [
    "nemo-toolkit[asr]>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
starling = "starling.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starling"]

[tool.hatch.build.targets.wheel.force-include]
"starling/data/models.yaml" = "starling/data/models.yaml"
"starling/web/templates" = "starling/web/templates"
"starling/web/static" = "starling/web/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
